const form=document.getElementById('quiz');
questions.forEach((item,i)=>{const box=document.createElement('section');box.className='question';box.id='qbox'+i;const h=document.createElement('h3');h.textContent=(i+1)+'. '+item.q;box.appendChild(h);item.options.forEach((opt,j)=>{const label=document.createElement('label');label.className='option';const input=document.createElement('input');input.type='radio';input.name='q'+i;input.value=j;input.addEventListener('change',updateProgress);label.appendChild(input);label.appendChild(document.createTextNode(String.fromCharCode(65+j)+'. '+opt));box.appendChild(label)});const exp=document.createElement('div');exp.className='explanation';exp.textContent='सही उत्तर: '+item.options[item.answer]+'. '+item.explanation;box.appendChild(exp);form.appendChild(box)});
function updateProgress(){const count=questions.filter((_,i)=>form.querySelector('input[name="q'+i+'"]:checked')).length;document.getElementById('progress').textContent='प्रश्न: '+count+' / '+questions.length+' हल किए'}
document.getElementById('submit').addEventListener('click',()=>{let score=0,attempted=0;questions.forEach((item,i)=>{const box=document.getElementById('qbox'+i);const selected=form.querySelector('input[name="q'+i+'"]:checked');const labels=box.querySelectorAll('.option');labels.forEach((label,j)=>{label.classList.remove('correct','wrong');if(j===item.answer)label.classList.add('correct')});if(selected){attempted++;if(Number(selected.value)===item.answer)score++;else labels[Number(selected.value)].classList.add('wrong')}box.querySelector('.explanation').style.display='block'});const percent=Math.round(score/questions.length*100);document.getElementById('result').textContent='आपका स्कोर: '+score+' / '+questions.length+' ('+percent+'%) | प्रयास किए: '+attempted+' | छोड़े: '+(questions.length-attempted);document.getElementById('result').scrollIntoView({behavior:'smooth',block:'center'});});
document.getElementById('reset').addEventListener('click',()=>{form.reset();document.querySelectorAll('.option').forEach(x=>x.classList.remove('correct','wrong'));document.querySelectorAll('.explanation').forEach(x=>x.style.display='none');document.getElementById('result').textContent='';updateProgress();window.scrollTo({top:0,behavior:'smooth'})});
</script></body></html>
